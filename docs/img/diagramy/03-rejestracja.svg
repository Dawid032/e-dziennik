<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1110" viewBox="0 0 1240 1110" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7486"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4e5f"/></marker>
<marker id="gen" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="#1c2536" stroke-width="1.4"/></marker>
</defs>
<rect width="1240" height="1110" fill="#ffffff"/>
<rect x="170" y="24" width="520" height="52" rx="26" fill="#1d4e5f" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="55.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">Administrator: Użytkownicy → „Rejestracja użytkownika”</text><rect x="170" y="116" width="520" height="78" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="140.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Formularz rejestracji</text><text x="430" y="160.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">GET /admin/users/create → AdminUserController@create</text><text x="430" y="180.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">resources/views/admin/users/create.blade.php</text><rect x="170" y="244" width="520" height="62" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="270.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Administrator wpisuje: imię, nazwisko, e-mail,</text><text x="430" y="290.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">rolę, hasło i powtórzenie hasła</text><polygon points="430,343 580,395 430,447 280,395" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="430" y="391.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Jaka rola?</text><text x="430" y="409.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">public/js/app.js</text><rect x="25" y="494" width="210" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="130" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Uczeń</text><text x="130" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">pojawia się wybór klasy</text><rect x="305" y="494" width="250" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Administrator / Nauczyciel</text><text x="430" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">bez dodatkowych pól</text><rect x="625" y="494" width="210" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="730" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Rodzic</text><text x="730" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">pojawia się lista dzieci</text><rect x="230" y="609" width="400" height="62" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="635.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Wysłanie formularza</text><text x="430" y="655.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">POST /admin/users</text><polygon points="430,715 665,790 430,865 195,790" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="430" y="766.54" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Dane poprawne? (UserRequest)</text><text x="430" y="785.54" text-anchor="middle" font-size="12" font-weight="400" fill="#5a6478">imię i nazwisko z wielkiej litery (regex),</text><text x="430" y="804.54" text-anchor="middle" font-size="12" font-weight="400" fill="#5a6478">unikalny e-mail, hasło 8+ z literą i cyfrą,</text><text x="430" y="823.54" text-anchor="middle" font-size="12" font-weight="400" fill="#5a6478">klasa dla ucznia, dziecko dla rodzica</text><rect x="170" y="906" width="520" height="78" rx="10" fill="#e4f3ea" stroke="#27704a" stroke-width="1.6"/><text x="430" y="930.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Zapis w transakcji bazy danych</text><text x="430" y="950.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">AdminUserController@store → save()</text><text x="430" y="970.4" text-anchor="middle" font-size="13" font-weight="400" fill="#5a6478">hasło zamieniane na hash bcrypt (cast „hashed” w modelu User)</text><path d="M895,902 A105,12 0 0 1 1105,902 L1105,988 A105,12 0 0 1 895,988 Z" fill="#efe9f7" stroke="#5b3f8c" stroke-width="1.6"/><path d="M895,902 A105,12 0 0 0 1105,902" fill="none" stroke="#5b3f8c" stroke-width="1.6"/><text x="1000" y="938.04" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Baza MySQL</text><text x="1000" y="956.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">users</text><text x="1000" y="974.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">parent_student</text><rect x="170" y="1042" width="520" height="56" rx="28" fill="#1d4e5f" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="1065.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">„Konto zostało utworzone” – nowy użytkownik</text><text x="430" y="1085.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">może się zalogować (diagram logowania)</text><rect x="850" y="747" width="300" height="86" rx="10" fill="#fbe9e6" stroke="#c8553d" stroke-width="1.6"/><text x="1000" y="775.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Powrót do formularza</text><text x="1000" y="795.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">z komunikatami przy polach</text><text x="1000" y="815.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">i zachowanymi danymi (old())</text><rect x="850" y="343" width="300" height="104" rx="10" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="1000" y="370.04" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Brak publicznej rejestracji</text><text x="1000" y="390.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Adres /register zwraca 404.</text><text x="1000" y="410.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Konta zakłada tylko administrator</text><text x="1000" y="430.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">(„rejestracja lub administrator”).</text><path d="M430,76 L430,115" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,195 L430,243" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,307 L430,342" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M280,395 L130,395 L130,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="205" y="386" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">uczeń</text><path d="M430,447 L430,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="500" y="476" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">admin / nauczyciel</text><path d="M580,395 L730,395 L730,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="650" y="386" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">rodzic</text><path d="M130,556 L130,590 L730,590 L730,556 M430,556 L430,590" stroke="#6b7486" stroke-width="1.6" fill="none"/><path d="M430,590 L430,608" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,672 L430,714" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,865 L430,905" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="406" y="890" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Tak</text><path d="M665,790 L848,790" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="755" y="780" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Nie</text><path d="M1150,790 L1190,790 L1190,275 L692,275" fill="none" stroke="#c8553d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrA)"/><text x="1180" y="265" text-anchor="end" font-size="13" fill="#c8553d" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">popraw dane</text><path d="M692,945 L893,945" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="795" y="936" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">INSERT</text><path d="M430,985 L430,1040" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>