<rect x="160" y="24" width="540" height="52" rx="26" fill="#1d4e5f" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="55.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">Administrator: „Użytkownicy → Rejestracja użytkownika”</text><rect x="170" y="116" width="520" height="78" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="140.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Formularz rejestracji</text><text x="430" y="160.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">GET /admin/users/create → AdminUserController@create</text><text x="430" y="180.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">resources/views/admin/users/create.blade.php</text><rect x="170" y="244" width="520" height="62" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="270.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Administrator wpisuje: imię, nazwisko, adres e-mail,</text><text x="430" y="290.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">rolę, hasło i powtórzenie hasła</text><polygon points="430,343 580,395 430,447 280,395" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="430" y="391.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Jaka rola?</text><text x="430" y="409.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">public/js/app.js</text><rect x="25" y="494" width="210" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="130" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Uczeń</text><text x="130" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">pojawia się wybór klasy</text><rect x="305" y="494" width="250" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Administrator / Nauczyciel</text><text x="430" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">bez dodatkowych pól</text><rect x="625" y="494" width="210" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="730" y="520.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Rodzic</text><text x="730" y="540.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">pojawia się lista dzieci</text><rect x="230" y="609" width="400" height="62" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="635.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Wysłanie formularza</text><text x="430" y="655.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">POST /admin/users</text><polygon points="430,710 680,790 430,870 180,790" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="430" y="766.54" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Dane poprawne?</text><text x="430" y="785.54" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">UserRequest</text><text x="430" y="804.54" text-anchor="middle" font-size="12" font-weight="400" fill="#5a6478">wymagane pola, wyrażenia regularne,</text><text x="430" y="823.54" text-anchor="middle" font-size="12" font-weight="400" fill="#5a6478">unikalny adres e-mail, zgodne hasła</text><rect x="170" y="905" width="520" height="100" rx="10" fill="#e4f3ea" stroke="#27704a" stroke-width="1.6"/><text x="430" y="930.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Zapis w transakcji bazy danych</text><text x="430" y="950.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">AdminUserController@store → save()</text><text x="430" y="970.4" text-anchor="middle" font-size="13" font-weight="400" fill="#5a6478">hasło zamieniane na skrót bcrypt</text><text x="430" y="990.4" text-anchor="middle" font-size="13" font-weight="400" fill="#5a6478">(rzutowanie <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">hashed</tspan> w modelu <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">User</tspan>)</text><path d="M895,912 A105,12 0 0 1 1105,912 L1105,998 A105,12 0 0 1 895,998 Z" fill="#efe9f7" stroke="#5b3f8c" stroke-width="1.6"/><path d="M895,912 A105,12 0 0 0 1105,912" fill="none" stroke="#5b3f8c" stroke-width="1.6"/><text x="1000" y="948.04" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Baza MariaDB</text><text x="1000" y="966.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">users</text><text x="1000" y="984.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">parent_student</text><rect x="160" y="1050" width="540" height="56" rx="28" fill="#1d4e5f" stroke="#1d4e5f" stroke-width="1.6"/><text x="430" y="1073.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">„Konto zostało utworzone” – nowy użytkownik</text><text x="430" y="1093.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">może się zalogować (rysunek 4)</text><rect x="850" y="747" width="300" height="86" rx="10" fill="#fbe9e6" stroke="#c8553d" stroke-width="1.6"/><text x="1000" y="775.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Powrót do formularza</text><text x="1000" y="795.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">z komunikatami przy polach</text><text x="1000" y="815.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">i zachowanymi danymi (<tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">old()</tspan>)</text><rect x="840" y="343" width="320" height="104" rx="10" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="1000" y="370.04" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Brak publicznej rejestracji</text><text x="1000" y="390.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Adres <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">/register</tspan> zwraca 404.</text><text x="1000" y="410.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Konta zakłada wyłącznie administrator,</text><text x="1000" y="430.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">co dopuszcza wymaganie W2.</text><path d="M430,76 L430,115" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,195 L430,243" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,307 L430,342" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M280,395 L130,395 L130,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="205" y="386" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">uczeń</text><path d="M430,447 L430,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="442" y="476" text-anchor="start" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">administrator / nauczyciel</text><path d="M580,395 L730,395 L730,493" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="650" y="386" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">rodzic</text><path d="M130,556 L130,590 L730,590 L730,556 M430,556 L430,590" stroke="#6b7486" stroke-width="1.6" fill="none"/><path d="M430,590 L430,608" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,672 L430,709" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M430,871 L430,904" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="406" y="893" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Tak</text><path d="M680,790 L848,790" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="764" y="780" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Nie</text><path d="M1150,790 L1190,790 L1190,275 L692,275" fill="none" stroke="#c8553d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrA)"/><text x="1180" y="265" text-anchor="end" font-size="13" fill="#c8553d" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">popraw dane</text><path d="M692,955 L893,955" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="795" y="946" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5"><tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">INSERT</tspan></text><path d="M430,1005 L430,1048" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/>
