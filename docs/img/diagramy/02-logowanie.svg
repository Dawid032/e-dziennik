<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1316" viewBox="0 0 1180 1316" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7486"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4e5f"/></marker>
<marker id="gen" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="#1c2536" stroke-width="1.4"/></marker>
</defs>
<rect width="1180" height="1316" fill="#ffffff"/>
<g transform="translate(24,6)"><rect x="230" y="24" width="380" height="52" rx="26" fill="#1d4e5f" stroke="#1d4e5f" stroke-width="1.6"/><text x="420" y="55.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">Użytkownik otwiera stronę logowania</text><rect x="200" y="115" width="440" height="70" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="420" y="145.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Formularz: adres e-mail i hasło</text><text x="420" y="165.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">resources/views/auth/login.blade.php</text><rect x="200" y="227" width="440" height="70" rx="10" fill="#ffffff" stroke="#1d4e5f" stroke-width="1.6"/><text x="420" y="257.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Wysłanie formularza</text><text x="420" y="277.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">POST /login → LoginController@store</text><polygon points="420,332 640,400 420,468 200,400" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="420" y="387.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Pola wypełnione i adres e-mail</text><text x="420" y="405.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">ma poprawny format?</text><text x="420" y="423.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">LoginRequest</text><polygon points="420,502 640,570 420,638 200,570" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="420" y="557.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Mniej niż 5 błędnych prób</text><text x="420" y="575.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">dla tego adresu e-mail w ciągu minuty?</text><text x="420" y="593.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">RateLimiter</text><polygon points="420,672 640,740 420,808 200,740" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="420" y="727.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Konto o tym adresie istnieje</text><text x="420" y="745.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">i hasło zgadza się ze skrótem bcrypt?</text><text x="420" y="763.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">Auth::attempt()</text><rect x="200" y="843" width="440" height="70" rx="10" fill="#e4f3ea" stroke="#27704a" stroke-width="1.6"/><text x="420" y="873.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Licznik prób wyzerowany, nowy identyfikator sesji</text><text x="420" y="893.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">session()-&gt;regenerate()</text><polygon points="420,950 570,1000 420,1050 270,1000" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="420" y="996.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Jaka rola?</text><text x="420" y="1014.04" text-anchor="middle" font-size="12" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">User::dashboardRoute()</text><rect x="7" y="1109" width="196" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="105" y="1135.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Administrator</text><text x="105" y="1155.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">/admin/dashboard</text><rect x="217" y="1109" width="196" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="315" y="1135.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Nauczyciel</text><text x="315" y="1155.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">/teacher/dashboard</text><rect x="427" y="1109" width="196" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="525" y="1135.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Uczeń</text><text x="525" y="1155.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">/student/dashboard</text><rect x="637" y="1109" width="196" height="62" rx="10" fill="#e4eff2" stroke="#1d4e5f" stroke-width="1.6"/><text x="735" y="1135.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2536">Rodzic</text><text x="735" y="1155.4" text-anchor="middle" font-size="13" font-weight="400" fill="#1d6f86" font-family="Menlo, Consolas, monospace">/parent/dashboard</text><rect x="725" y="365" width="330" height="70" rx="10" fill="#fbe9e6" stroke="#c8553d" stroke-width="1.6"/><text x="890" y="395.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Komunikat przy polu, np.</text><text x="890" y="415.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">„Pole e-mail jest wymagane”</text><rect x="725" y="535" width="330" height="70" rx="10" fill="#fbe9e6" stroke="#c8553d" stroke-width="1.6"/><text x="890" y="565.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">„Zbyt wiele prób logowania.</text><text x="890" y="585.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Spróbuj ponownie za … s”</text><rect x="725" y="705" width="330" height="70" rx="10" fill="#fbe9e6" stroke="#c8553d" stroke-width="1.6"/><text x="890" y="735.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">Licznik błędnych prób zwiększony o 1</text><text x="890" y="755.4" text-anchor="middle" font-size="15" font-weight="400" fill="#1c2536">„Nieprawidłowy e-mail lub hasło”</text><path d="M420,76 L420,113" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,185 L420,225" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,297 L420,330" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,468 L420,500" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="396" y="490" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Tak</text><path d="M420,638 L420,670" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="396" y="660" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Tak</text><path d="M420,808 L420,841" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="396" y="830" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Tak</text><path d="M420,913 L420,948" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,1050 L420,1080 M105,1080 L735,1080" stroke="#6b7486" stroke-width="1.6" fill="none"/><path d="M105,1080 L105,1107" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M315,1080 L315,1107" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M525,1080 L525,1107" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M735,1080 L735,1107" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><path d="M640,400 L723,400" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="682.5" y="392" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Nie</text><path d="M640,570 L723,570" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="682.5" y="562" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Nie</text><path d="M640,740 L723,740" fill="none" stroke="#6b7486" stroke-width="1.6" marker-end="url(#arr)"/><text x="682.5" y="732" text-anchor="middle" font-size="13" fill="#5a6478" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Nie</text><path d="M1055,400 L1100,400 M1055,570 L1100,570 M1055,740 L1100,740" stroke="#c8553d" stroke-width="1.6" fill="none" stroke-dasharray="7 5"/><path d="M1100,740 L1100,150 L642,150" fill="none" stroke="#c8553d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrA)"/><text x="1090" y="140" text-anchor="end" font-size="13" fill="#c8553d" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">powrót do formularza</text><rect x="20" y="1210" width="800" height="84" rx="10" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="420" y="1237.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Każde kolejne żądanie sprawdzają middleware <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">auth</tspan> (czy użytkownik jest zalogowany?)</text><text x="420" y="1257.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">i <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">role:</tspan> (czy ma właściwą rolę?).</text><text x="420" y="1277.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Użytkownik niezalogowany → przekierowanie na <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">/login</tspan>; niewłaściwa rola → strona 403 „Brak dostępu”.</text></g>
</svg>