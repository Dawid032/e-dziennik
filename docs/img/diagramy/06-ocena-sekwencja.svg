6f86">POST /gradebook/1/1/grades</tspan> (ocena 5, waga 3)</text><circle cx="77" cy="140" r="10" fill="#c8553d"/><text x="77" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><path d="M285,184 L325,184 L325,202 L289,202" fill="none" stroke="#1c2536" stroke-width="1.6" marker-end="url(#arr)"/><text x="335" y="198" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5"><tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">auth</tspan> + <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">role:teacher,admin</tspan> – czy dostęp jest dozwolony?</text><circle cx="269" cy="193" r="10" fill="#c8553d"/><text x="269" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><path d="M285,248 L466,248" fill="none" stroke="#1c2536" stroke-width="1.6" marker-end="url(#arr)"/><text x="297" y="240" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5">przekaż żądanie do walidacji</text><circle cx="267" cy="248" r="10" fill="#c8553d"/><text x="267" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><path d="M470,292 L510,292 L510,310 L474,310" fill="none" stroke="#1c2536" stroke-width="1.6" marker-end="url(#arr)"/><text x="520" y="306" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5"><tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">authorize()</tspan>: czy uczy tego przedmiotu w tej klasie? (<tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">canGrade()</tspan>)</text><circle cx="454" cy="301" r="10" fill="#c8553d"/><text x="454" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><path d="M470,346 L510,346 L510,364 L474,364" fill="none" stroke="#1c2536" stroke-width="1.6" marker-end="url(#arr)"/><text x="520" y="360" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5"><tspan font-family="Menlo, C