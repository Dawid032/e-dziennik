arr)"/><text x="667" y="834" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5">wiersze z bazy</text><path d="M655,896 L1391,896" fill="none" stroke="#1c2536" stroke-width="1.6" marker-end="url(#arr)"/><text x="667" y="888" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5">przekaż dane do widoku arkusza (oceny i średnie ważone)</text><circle cx="637" cy="896" r="10" fill="#c8553d"/><text x="637" y="900" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">14</text><path d="M1395,950 L99,950" fill="none" stroke="#5a6478" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="107" y="942" font-size="13.5" fill="#1c2536" paint-order="stroke" stroke="#fff" stroke-width="5">gotowa strona HTML z nową oceną</text><circle cx="77" cy="950" r="10" fill="#c8553d"/><text x="77" y="954" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">15</text><rect x="40" y="993" width="1420" height="82" rx="10" fill="#fcf1da" stroke="#8f5a00" stroke-width="1.6"/><text x="750" y="1018.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Ścieżki alternatywne: brak uprawnień (krok 2 lub 4) → strona 403; błędne dane (krok 5) → powrót do formularza z komunikatami.</text><text x="750" y="1039.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Zmiana oceny: <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">PUT /grades/{grade}</tspan> → <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">update()</tspan> → zdarzenie <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">updated</tspan> → wpis w historii „było → jest”.</text><text x="750" y="1060.04" text-anchor="middle" font-size="14" font-weight="400" fill="#1c2536">Usunięcie oceny: <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">DELETE /grades/{grade}</tspan> → <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">delete()</tspan> ustawia <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">deleted_at</tspan> (ocena zostaje w bazie) → zdarzenie <tspan font-family="Menlo, Consolas, monospace" fill="#1d6f86">deleted</tspan> → wpis „Usunięto”.</text>
</svg>